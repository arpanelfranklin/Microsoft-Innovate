name: security-scan 

on:
  pull_request: 
  push:
    branches:
      - main

jobs:
  scan-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reports 
        run: mkdir -p reports
      
    
      - name: Install Gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.28.0_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks 
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path reports/gitleaks.json \
            --exit-code 1
        continue-on-error: true
      
      - name: Display Gitleaks report 
        run: | 
           if [ -f reports/gitleaks.json ]; then
            cat reports/gitleaks.json
           else
            echo "No Gitleaks report generated."
           fi

      - name: Upload gitleaks report 
        uses: actions/upload-artifact@v4
        with: 
            name: gitleaks-report 
            path: reports/gitleaks.json
          

      - name: Run TruffleHog
        run: |
          docker run --rm \
            -v "$PWD:/tmp" \
            -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///tmp/ \
            --since-commit "${{ github.event.repository.default_branch }}" \
            --branch HEAD \
            --only-verified \
            --json \
            > reports/trufflehog.json
        continue-on-error: true

      - name: Display TruffleHog report
        run: |
          if [ -f reports/trufflehog.json ]; then
            cat reports/trufflehog.json
          else
            echo "No TruffleHog report generated."
          fi
      - name: Upload TruffleHog report
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: reports/trufflehog.json